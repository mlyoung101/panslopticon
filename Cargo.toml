[package]
name = "panslopticon"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
env_logger = "0.11.11"
eyre = "0.6.12"
git2 = "0.21.0"
log = "0.4.33"
regex = "1.13.0"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
soup = "0.5.1"
sqlx = { version = "0.9.0", features = ["derive", "sqlite"] }
sqlx-sqlite = { version = "0.9.0", features = ["chrono", "json", "time", "uuid"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
toml = "1.1.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
