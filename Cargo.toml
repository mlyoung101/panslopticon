[package]
name = "panslopticon"
version = "0.9.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
dialoguer = "0.12.0"
dotenvy = "0.15.7"
env_logger = "0.11.11"
git2 = "0.21.0"
indicatif = { version = "0.18.6", features = ["futures", "tokio"] }
lazy_static = "1.5.0"
lingua = "1.8.0"
log = "0.4.33"
octocrab = "0.54.0"
rand = { version = "0.10.2", features = ["serde"] }
regex = "1.13.0"
regex-cache = "0.2.1"
reqwest = "0.13.4"
reqwest-middleware = { version = "0.5.2", features = ["http2", "json", "rustls"] }
reqwest-retry = "0.9.1"
rustls = { version = "0.23.42", features = ["aws-lc-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["chrono", "derive", "postgres", "runtime-tokio", "tls-rustls"] }
subprocess = "1.2.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
toml = "1.1.3"

[profile.release]
lto = true
